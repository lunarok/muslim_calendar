[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muslim_calendar"
version = "1.2.0"
description = "Muslim Calendar - Islamic prayer times and Hijri calendar for Home Assistant"
requires-python = ">=3.10"
dependencies = [
    "homeassistant>=2024.0.0",
    "hijri-converter>=3.0.0",
    "prayer-times-calculator>=1.0.0",
]
